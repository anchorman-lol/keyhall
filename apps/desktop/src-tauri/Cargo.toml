[package]
name = "keyhall"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "keyhall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
nostr = { version = "0.45", default-features = false, features = ["std", "os-rng", "nip44"] }
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
